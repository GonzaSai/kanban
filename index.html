<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Mi Kanban</h1>

  <div class="kanban">

    <div class="column" id="todo">
      <h2>Pendiente</h2>
      <div class="tasks"></div>
      <input type="text" placeholder="Nueva tarea">
      <button onclick="addTask('todo')">Agregar</button>
    </div>

    <div class="column" id="doing">
      <h2>En Progreso</h2>
      <div class="tasks"></div>
      <input type="text" placeholder="Nueva tarea">
      <button onclick="addTask('doing')">Agregar</button>
    </div>

    <div class="column" id="done">
      <h2>Hecho</h2>
      <div class="tasks"></div>
      <input type="text" placeholder="Nueva tarea">
      <button onclick="addTask('done')">Agregar</button>
    </div>

  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
